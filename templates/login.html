<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STORYVERSE · Acceso privado</title><link rel="stylesheet" href="/static/style.css"></head><body class="admin-body"><div class="login-card"><a class="brand" href="/"><span class="brand-mark">S</span><span>STORY<span class="violet">VERSE</span></span></a><div class="eyebrow">ZONA RESTRINGIDA</div><h1>Acceso de administrador</h1><p>Este espacio está reservado al propietario de STORYVERSE.</p><form id="loginForm"><label>Contraseña<input id="adminPassword" type="password" autocomplete="current-password" required placeholder="Tu contraseña"></label><button class="btn primary full">Ingresar de forma segura ↗</button></form><div id="loginError" class="form-error"></div><a class="back-link" href="/">← Volver al estudio</a></div><script>
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('adminPassword').value})});const d=await r.json();if(r.ok)location.reload();else document.getElementById('loginError').textContent=d.error||'No se pudo ingresar';});
</script></body></html>
